# Ambiente de desenvolvimento: docker compose up
#   Frontend: http://localhost:5173
#   API/docs: http://localhost:8000/docs

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glicemia
      POSTGRES_PASSWORD: glicemia
      POSTGRES_DB: glicemia
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glicemia -d glicemia"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      target: dev
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://glicemia:glicemia@db:5432/glicemia
      SECRET_KEY: chave-apenas-para-desenvolvimento
      # No Windows/macOS, eventos de arquivo não atravessam o bind mount; polling garante o reload.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://backend:8000
      VITE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # node_modules fica num volume próprio: os binários do Windows não servem no Linux.
      - node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dados-postgres:
  node-modules:
